    <style id="splash-css">
      html { background: #0B0818; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #0B0818; color: #EEEAFF;
        font-family: Onest, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity .5s ease, transform .5s cubic-bezier(.4, 0, .2, 1), visibility 0s linear .5s;
      }
      #splash.splash-out { opacity: 0; transform: scale(1.05); visibility: hidden; pointer-events: none; }
      .sp-bg {
        position: absolute; inset: -10%;
        background:
          radial-gradient(60% 45% at 20% 10%, rgba(37, 99, 235, .38), transparent 70%),
          radial-gradient(60% 45% at 85% 92%, rgba(192, 38, 211, .36), transparent 70%),
          radial-gradient(45% 32% at 50% 50%, rgba(147, 51, 234, .26), transparent 70%);
        animation: sp-drift 9s ease-in-out infinite alternate;
      }
      .sp-center { position: absolute; left: 50%; top: 50%; width: 124px; height: 124px; margin: -62px 0 0 -62px; }
      .sp-halo {
        position: absolute; inset: -34px; border-radius: 50%; filter: blur(30px); opacity: .75;
        background: conic-gradient(from 0deg, #2563EB, #9333EA, #EC4899, #FBBF24, #2563EB);
        animation: sp-spin 7s linear infinite, sp-breathe 3s ease-in-out infinite;
      }
      .sp-icon-wrap {
        position: absolute; inset: 0;
        filter: drop-shadow(0 16px 24px rgba(0, 0, 0, .55));
        animation: sp-pop .9s cubic-bezier(.2, 1.25, .35, 1) both, sp-float 3.4s ease-in-out .9s infinite;
      }
      .sp-icon-wrap img { display: block; width: 100%; height: 100%; }
      .sp-icon-wrap::after {
        content: ''; position: absolute; inset: 0;
        -webkit-mask: url(/icon-192.png) center / 100% 100% no-repeat; mask: url(/icon-192.png) center / 100% 100% no-repeat;
        background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .28) 50%, transparent 65%);
        transform: translateX(-120%); animation: sp-shine 2.8s ease-in-out 1.1s infinite;
      }
      .sp-spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #FBBF24; box-shadow: 0 0 10px 2px rgba(251, 191, 36, .8); opacity: 0; animation: sp-twinkle 2.6s ease-in-out infinite; }
      .sp-spark:nth-child(1) { left: -46px; top: 8px; animation-delay: .9s; }
      .sp-spark:nth-child(2) { right: -52px; top: 30px; width: 4px; height: 4px; animation-delay: 1.5s; background: #F0ABFC; box-shadow: 0 0 10px 2px rgba(240, 171, 252, .8); }
      .sp-spark:nth-child(3) { right: -30px; bottom: -34px; animation-delay: 2.1s; }
      .sp-spark:nth-child(4) { left: -34px; bottom: -22px; width: 4px; height: 4px; animation-delay: 1.2s; background: #7DD3FC; box-shadow: 0 0 10px 2px rgba(125, 211, 252, .8); }
      .sp-text { position: absolute; left: 0; right: 0; top: calc(50% + 62px + 40px); text-align: center; padding: 0 28px; }
      .sp-title {
        font-family: Unbounded, Onest, system-ui, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: .01em; margin: 0;
        background: linear-gradient(90deg, #93C5FD, #C4B5FD 45%, #F9A8D4); -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: sp-up .7s ease .35s both;
      }
      .sp-tag { margin: 10px 0 0; text-wrap: balance; font-size: 14px; line-height: 1.4; color: rgba(238, 234, 255, .62); animation: sp-up .7s ease .55s both; }
      .sp-bar {
        position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px); width: 120px; height: 4px; margin-left: -60px;
        border-radius: 4px; overflow: hidden; background: rgba(238, 234, 255, .1); animation: sp-up .6s ease .8s both;
      }
      .sp-bar i {
        position: absolute; top: 0; bottom: 0; width: 45%; border-radius: 4px;
        background: linear-gradient(90deg, #2563EB, #9333EA, #EC4899); animation: sp-load 1.4s cubic-bezier(.65, 0, .35, 1) infinite;
      }
      @keyframes sp-pop { 0% { opacity: 0; transform: scale(.55) translateY(14px); } 100% { opacity: 1; transform: none; } }
      @keyframes sp-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes sp-shine { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(120%); } }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @keyframes sp-breathe { 0%, 100% { opacity: .55; } 50% { opacity: .9; } }
      @keyframes sp-twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes sp-load { 0% { left: -45%; } 100% { left: 100%; } }
      @keyframes sp-drift { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(2%, 2%, 0) scale(1.06); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation: none !important; }
        .sp-spark { display: none; }
        .sp-bar i { left: 27%; }
      }
    </style>

        <span class="sp-spark"></span><span class="sp-spark"></span><span class="sp-spark"></span><span class="sp-spark"></span>
        <div class="sp-icon-wrap"><img src="/icon-192.png" width="124" height="124" alt="" decoding="async" /></div>
      </div>
      <div class="sp-text">
        <h1 class="sp-title">Family</h1>
        <p class="sp-tag" id="sp-tag">Задания для детей, кристаллы и награды.</p>
      </div>
      <div class="sp-bar"><i></i></div>
    </div>

        var el = document.getElementById('sp-tag');
        if (el && T[l]) el.textContent = T[l];
      })();
